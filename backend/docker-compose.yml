services:
  db:
    image: postgres:17-alpine
    container_name: parking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_password
    ports:
      - "5432:5432"
    volumes:
      - parking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_user -d parking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parking-postgres-data:
